name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: itsdarklikehell/ci-templates/.github/workflows/ci-generic.yml@v1
    with:
      docker-build: false
